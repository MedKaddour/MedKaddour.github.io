<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Concerto reconfiguration experiments">
  <rect width="900" height="500" fill="#f8f4f0"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="450" y="68" font-size="34" font-weight="700" fill="#2b211c" text-anchor="middle">Coordinated reconfiguration</text>
    <text x="450" y="104" font-size="20" fill="#7a6a60" text-anchor="middle">Concerto components on distributed databases</text>

    <g stroke="#c9b8ac" stroke-width="3" fill="none">
      <path d="M250 220 L330 220"/>
      <path d="M570 220 L650 220"/>
      <path d="M450 268 L450 330"/>
    </g>
    <g fill="#c9b8ac">
      <polygon points="330,220 318,213 318,227"/>
      <polygon points="650,220 638,213 638,227"/>
      <polygon points="450,330 443,318 457,318"/>
    </g>

    <g>
      <rect x="70" y="180" width="180" height="80" rx="18" fill="#ffffff" stroke="#d8c9bd" stroke-width="2"/>
      <text x="160" y="216" font-size="20" font-weight="700" fill="#2b211c" text-anchor="middle">uninstalled</text>
      <text x="160" y="242" font-size="16" fill="#7a6a60" text-anchor="middle">place</text>

      <rect x="330" y="170" width="240" height="100" rx="20" fill="#8f3f2a"/>
      <text x="450" y="208" font-size="23" font-weight="700" fill="#fff8f2" text-anchor="middle">transition</text>
      <text x="450" y="238" font-size="16" fill="#f6ddd3" text-anchor="middle">deploy &#183; reconfigure</text>

      <rect x="650" y="180" width="180" height="80" rx="18" fill="#ffffff" stroke="#d8c9bd" stroke-width="2"/>
      <text x="740" y="216" font-size="20" font-weight="700" fill="#2b211c" text-anchor="middle">running</text>
      <text x="740" y="242" font-size="16" fill="#7a6a60" text-anchor="middle">place</text>
    </g>

    <g>
      <rect x="180" y="330" width="540" height="110" rx="18" fill="#ffffff" stroke="#d8c9bd" stroke-width="2"/>
      <text x="450" y="368" font-size="20" font-weight="700" fill="#2b211c" text-anchor="middle">Galera cluster on Grid'5000</text>
      <g fill="#1f5673">
        <circle cx="330" cy="404" r="14"/><circle cx="450" cy="404" r="14"/><circle cx="570" cy="404" r="14"/>
      </g>
      <g stroke="#1f5673" stroke-width="2.5">
        <line x1="344" y1="404" x2="436" y2="404"/>
        <line x1="464" y1="404" x2="556" y2="404"/>
      </g>
    </g>
  </g>
</svg>
